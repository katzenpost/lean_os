[package]
name = "lean-os"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "Operating system calls for Lean 4 programs that Lean's standard library lacks, on Linux and Android: the Rust half of the Lean package lean_os"
repository = "https://github.com/katzenpost/lean_os"
readme = "../README.md"
keywords = ["lean", "ffi", "fsync"]
categories = ["external-ffi-bindings"]

[lib]
name = "lean_os"
crate-type = ["staticlib"]

[dependencies]
lean-sys = { git = "https://github.com/katzenpost/lean-sys", rev = "7b998184a82d6a6ddcc7626abf5eaac2e5345244", package = "katzenpost-lean-sys", default-features = false, features = ["mimalloc"] }

[profile.release]
panic = "abort"
